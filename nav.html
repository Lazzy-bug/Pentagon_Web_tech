<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .nav-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            box-shadow: 0px 2px 10px black;
            padding: 5px;
        }

        input{
            height: 30px;
            width: 300px;
            text-align: center;
            border-radius: 20px;
        }

        .right{
            display:flex;
            justify-content: space-between;
            width:150px;
        }

        .right h2:hover{
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }        
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="left">
            <img height="70px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTF0SxNSbaj8O18O461l78hFysBKaAI5u6p9w&s" alt="logo">
        </div>
        <div class="middle">
            <input type="text" name="search" placeholder="Search">
        </div>
        <div class="right">
            <h2>Login</h2>
            <h2>Signup</h2>
        </div>
    </div>

</body>
</html>
