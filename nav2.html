<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav2</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        .nav-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f0f0f0;
            background-color: black;
            color: white;
            height: 75px;
        }

        .left{
            display: flex;
            align-items: center;
            gap: 30px;
        }

        input{
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid gray;
            width: 400px;
            height: 40px;
        }

        button{
            padding: 6px 12px;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
            border-radius: 8px;
            background-color: black;
            color: white;
            border: 2px solid white;
            height: 40px;

        }

        .left h4{
            color: grey;
        }
        button:hover{
            transition-duration: 1s;
            background-color: #fff;
            color: black;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="left">
            <h2>logo</h2>
            <h4 style="color: white;">HOME</h4>
            <h4>ABOUT</h4>
            <h4>PRODUCT</h4>

        </div>
        <div class="right">
            <input type="text" placeholder="Search">
            <button>Search</button>
        </div>
    </div>
</body>
</html>
