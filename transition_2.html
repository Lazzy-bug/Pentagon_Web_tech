<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;

        }
        .box{
            height: 100vh;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        h2{
            font-size: 120px;
            cursor: pointer;
            transition: all 1s ease;
            animation: pulse 2s infinite;
            -webkit-text-stroke: 2px rgb(255, 255, 255);
        }

        .p h2:hover{
            text-shadow: 0px 40px 2px #ff000081,
            0px -40px 2px #ff000081,
            0px -80px 2px #4683b4a6,
            0px 80px 2px #4683b4a6;
        }

        .r h2:hover{
            transform: rotate(-4deg);
            text-shadow: -60px -60px 2px #ff000081,
            80px -80px 2px #ff000081,
            100px 100px 2px #4683b4a6,
            -60px 60px 2px #6e46b4a6;

        }

        .i h2:hover{
            transform: scale(1.5);
            text-shadow: 
            0px 40px 2px #ff000081,
            0px -40px 2px #ff000081,
            0px -80px 2px #4683b4a6,
            0px 80px 2px #4683b4a6;
        }

        .t h2:hover{
            transform: skew(10deg,10deg);
            color: #fff;
        }

        .h h2:hover{
            transform: rotate(-4deg);
            text-shadow: 
            -60px -60px 2px #ff0000dd,
            -100px -100px 2px #ff000081,
            100px 100px 2px #4683b4a6,
            60px 60px 2px #6e46b4a6;
            -webkit-text-stroke: 2px rgb(255, 238, 0);
        }

        .v h2:hover{
            transform: skew(10deg,10deg) scale(2);
            transition: all 2s ease;
        }

        body .v:hover{
            /* transform: rotate(-4deg);
            text-shadow: 
            -60px 60px 2px #ff000081,
            -100px 100px 2px #ff000081,
            100px -100px 2px #4683b4a6,
            60px -60px 2px #6e46b4a6; */
            background-color: #fff;
            color: black;
        }
        
        
    </style>
</head>
<body>
    <div class="box">
        <div class="p"><h2>P</h2></div>
        <div class="r"><h2>R</h2></div>
        <div class="i"><h2>I</h2></div>
        <div class="t"><h2>T</h2></div>
        <div class="h"><h2>H</h2></div>
        <div class="v"><h2>V</h2></div>
        <div class="i"><h2>I</h2></div>
    </div>
</body>
</html>
