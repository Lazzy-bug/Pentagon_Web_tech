<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        nav{
            background-color: pink;
            display: flex;
            height: 75px;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            padding-left: 20px;
            padding-right: 20px;
        }
        .menu-icon{
            display: none;
        }

        .nav-links a{
            text-decoration: none;
            color: black;
            padding: 10px;
            transition: box-shadow 1s ease;
            border-radius: 10px;
        }

        .nav-links{
            display: flex;
            gap: 40px;
        }
        @media (max-width:600px) {
            .menu-icon{
                display: block;
            }
            .nav-links a{
                display: none;
            }
        }

        .nav-links a:hover{
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.568) inset;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><img height="50px" src="https://cdn-icons-png.flaticon.com/512/6236/6236513.png" alt=""></div>
        <div class="nav-links">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Services</a>
            <a href="">Contact</a>
        </div>
        <div class="menu-icon">&#9776</div>
    </nav>
</body>
</html>
