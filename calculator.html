<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c2c2c;
        }
        .calculator {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 10px;
            background-color: #575757;
        }
        input {
            width: 100%;
            height: 90px;
            margin-bottom: 10px;
            text-align: right;
            font-size: 18px;
            border: 0;
            background-color: #c4c3c3;
            border-radius: 15px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 90px;
            width: 90px;
            font-size: 50px;
            cursor: pointer;
            border-radius: 50%;
            border: 0;
            background-color: #a8a8a8;
        }

        .opr {
            background-color: #ff9500;
            color: white;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text">
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="opr">/</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="opr">*</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="opr">-</button>
            <button>0</button>
            <button>.</button>
            <button class="opr">=</button>
            <button class="opr">+</button>
    </div>
</body>
</html>
