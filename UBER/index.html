<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <center><img height="50px" src="https://www.edigitalagency.com.au/wp-content/uploads/new-Uber-logo-white-png-large-size.png" alt=""></center>
    </header>
    <div class="box">
        <div class="vehicle">
            <div class="v_img" id="bike">
                <img height="220px" src="./processed_image.png" alt="bike">
            </div>
            <input id="distance" type="number" placeholder="Enter KM" >
            <button onclick="showDistance()">Book now</button>
        </div>
        <div class="vehicle">
            <div class="v_img" id="auto">
                <img height="220px" src="https://p.turbosquid.com/ts-thumb/nV/72FvHt/Mf5MsGhh/rr/jpg/1562796635/600x600/turn_fit_q87/f5417003630c50664d413f815cb0af3d60260ae7/rr-1.jpg" alt="">
            </div>
            <input id="distance" type="number" placeholder="Enter KM" >
            <button onclick="showDistance()">Book now</button>
        </div>
        <div class="vehicle">
            <div class="v_img" id="car">
                <img height="220px" src="https://p.turbosquid.com/ts-thumb/rZ/Jby2Zm/1c7ghSMu/car_01.effectsresult/jpg/1551442632/600x600/fit_q87/56ebdb99d1accc9822e926b1b9e7cb9966389e91/car_01.effectsresult.jpg" alt="">
            </div>
            <input id="distance" type="number" placeholder="Enter KM" >
            <button onclick="showDistance()">Book now</button>
        </div>
    </div>

    <script>
        function showDistance() {
            var distance = document.getElementById('distance').value;
            alert(`you hv selected ${distance}`);
        }

    </script>
</body>
</html>
