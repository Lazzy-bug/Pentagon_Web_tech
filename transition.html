<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="https://cdn-icons-png.flaticon.com/512/616/616408.png">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        h2{
            margin-top: 20px;
        }
        .box{
            height: 100vh;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .img-box{
            height: 180px;
            width: 180px;
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            transition: all 1s ease;
        }
        img{
            width: 100%;
        }
        .img-box:hover{
            transform: scale(1.5,1.5);
            border-radius: 50%;
            box-shadow: 0px 0px 30px rgb(0, 0, 0);
        }

        </style>
</head>
<body>
    <h2>Dogs</h2>
    <p>hover over the img for transition</p>
    <div class="box">
    <div class="img-box"><img src="https://rukminim2.flixcart.com/image/480/640/xif0q/poster/l/f/w/medium-dog-posters-for-wall-decoration-12-x-18-inch-puppy-dog-original-imah423rmveuu66j.jpeg?q=20" alt=""></div>
    <div class="img-box"><img src="https://hips.hearstapps.com/hmg-prod/images/dog-puppy-on-garden-royalty-free-image-1586966191.jpg?crop=0.752xw:1.00xh;0.175xw,0&resize=1200:*" alt=""></div>
    <div class="img-box"><img src="https://hips.hearstapps.com/hmg-prod/images/young-rottweiler-dog-pup-lying-on-lawn-in-garden-news-photo-539276720-1551895722.jpg?crop=0.440xw:1.00xh;0.343xw,0" alt=""></div>
    </div>
</body>
</html>
